# Workaround: NEC's el8-era ve_monitor corrupts the heap during
# VE0 1st Init on modern glibc (fclose() trips over smashed chunk
# metadata -> SIGSEGV / malloc_printerr SIGABRT). The same binary runs
# fine on RHEL 8's older allocator, so interpose jemalloc instead of
# the hardened glibc malloc. Remove this drop-in to test the stock
# allocator. See sys-libs/glibc-ve1 for the related EM_VE QA issue.
[Service]
Environment=LD_PRELOAD=/usr/lib64/libjemalloc.so.2
